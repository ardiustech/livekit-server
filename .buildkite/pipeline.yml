# Buildkite CD (deploy only) for the ardiustech/livekit-server fork
# (pipeline slug: tax-credits-livekit-server).
#
# CI (build/vet/test) moved to GitHub Actions — see
# .github/workflows/buildtest.yaml for the full history of why: 18 straight
# Buildkite build attempts reproducibly failed `go mod download`'s ~120+
# fresh fetches from proxy.golang.org (different agent, different queue,
# every environmental lever tried — GOMAXPROCS, GOSUMDB, IPv6 disable,
# dependency scoping, an internal module cache), while the identical
# download finished in 12s from an unrelated network. That points to a hard
# connection-count/rate limit in Buildkite's own network infra, not
# something fixable in this repo's config — GitHub Actions runners aren't on
# that network at all.
#
# This pipeline is triggered by a GitHub Deployment (created by the "deploy"
# job in buildtest.yaml, only after CI passes on a push to master) — enable
# "Trigger builds on deployments" in this pipeline's Buildkite settings.
# Mirrors ardiustech/tax-credits-mcp's own working pipeline structure (same
# trigger mechanism, same BUILDKITE_GITHUB_DEPLOYMENT_* env vars) — the only
# other Go project in this org with in-repo evidence of what actually works.
#
# Deploy mechanism is unchanged from before this split: builds + pushes an
# amd64 image (the LiveKit box is a c6i x86_64 instance, unlike the
# watercooler app's arm64 box) and triggers an on-box graceful-drain deploy
# via SSM. NOT a blue/green swap — LiveKit binds fixed host-network ports, so
# there's no second color to flip to. Instead it leans on LiveKit's own
# built-in graceful shutdown (SIGTERM -> router.Drain() + wait for active
# participants to leave, already how the binary behaves): a deploy doesn't
# forcibly drop calls in progress, new joins just pause for the drain window.
# True zero-downtime needs a second node + Redis-backed multi-node LiveKit, a
# separate, materially bigger effort. Requires LK_AWS_ACCESS_KEY_ID /
# LK_AWS_SECRET_ACCESS_KEY secrets (the watercooler-livekit-ci IAM user) —
# named LK_* to avoid clashing with the agent's existing AWS_* creds or
# watercooler's own WC_* creds. See .buildkite/README.md.
agents:
  queue: default

steps:
  - label: ":rocket: deploy (graceful drain)"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "production"
    command: .buildkite/steps/deploy.sh
    timeout_in_minutes: 25
    # Only ONE deploy against this single-node box at a time (review finding,
    # 2026-08-02) — two overlapping deploys would race on the same
    # docker-compose.yaml/.env and could double-prune a concurrently-pulling
    # image.
    concurrency: 1
    concurrency_group: "livekit-server/deploy"
    # Deliberately NOT auto-retried (review finding, 2026-08-02): this step is
    # only "idempotent" up to the point it calls `ssm send-command` — after
    # that, a blanket retry on ANY failure (including the poll step simply
    # timing out while the box is still legitimately mid-graceful-drain) can
    # fire a SECOND live SSM command against the same box while the first is
    # still running, racing on the same docker-compose.yaml/.env. A transient
    # build/push failure (the actually-safe-to-retry case) should be re-run
    # manually after confirming via `.buildkite/steps/deploy.sh`'s own SSM
    # command id whether a deploy is already in flight.
