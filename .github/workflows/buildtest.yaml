# CI for the ardiustech/livekit-server fork.
#
# Runs on GitHub Actions, not Buildkite (review finding, 2026-08-03): Buildkite's
# own network egress reproducibly failed `go mod download`'s ~120+ fresh
# fetches from proxy.golang.org across 18 build attempts — different agent,
# different queue, every environmental lever tried (GOMAXPROCS, GOSUMDB, IPv6
# disable, dependency scoping) — while the identical download finished in 12s
# from an unrelated network. That points to a hard connection-count/rate limit
# in Buildkite's own infra, not something fixable in this repo's config.
# GitHub Actions runners aren't on that network at all.
#
# Simplified from the inherited upstream version of this file: dropped the
# deadlock.Mutex swap-in, `mage build`, and golangci-lint — upstream's own
# extra correctness/style layers, not vetted here and not needed to verify
# this fork's actual changes (all under pkg/rtc/). Prioritizing a CI that
# reliably reflects "does this fork build and pass its own tests" over
# maximal thoroughness, especially after the extended Buildkite investigation
# this replaces.
#
# On success, `build-and-deploy` builds+pushes the image AND runs the on-box
# SSM deploy itself — CD lives entirely in GitHub Actions now (2026-08-03).
#
# This used to hand off to a Buildkite pipeline via a GitHub Deployment
# (mirroring what looked like ardiustech/tax-credits-mcp's own working
# split). Retired after two real problems surfaced running it live:
# 1. The GitHub Deployment -> Buildkite webhook handoff was silently
#    broken the whole time (Buildkite's trigger fires on a
#    `deployment_status` event, not plain `deployment` creation — a status
#    call this workflow never made — so PR #7 merged, built + pushed the
#    image successfully, and Buildkite never triggered at all).
# 2. The actual reason Buildkite existed for OTHER pipelines in this org —
#    self-hosted agents in Gusto's own network, with a `higher-envs`
#    cluster specifically for reaching production — doesn't apply here.
#    This pipeline's target AWS account (`ardius-admin-ardius-dev`) is a
#    separate, lower-stakes account from the one that cluster protects, and
#    this pipeline was never even assigned to it (ran unclustered). And
#    `tax-credits-mcp`'s own "working" pipeline turned out to have the
#    identical missing-status gap, and doesn't even appear in this org's
#    Buildkite pipeline list — the precedent this was modeled on was never
#    actually confirmed to trigger live either.
# See .buildkite/README.md for the full retirement writeup and the
# extended history of why CI moved off Buildkite in the first place.
name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Cancel a superseded run of THIS job on the same ref (review finding,
    # 2026-08-03) — rapid pushes previously queued redundant full test runs
    # instead of canceling stale ones. Scoped to `test` only, not the whole
    # workflow, so this never touches `deploy`'s own concurrency group below.
    concurrency:
      group: livekit-server-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # fetch-depth: 0 (full history), not the actions/checkout default
      # (single commit) — needed for the diff-scoped gofmt check below to
      # resolve origin/<base> / HEAD^ without a separate fetch.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: shogo82148/actions-setup-redis@2f3253b148c73d7a0682eae73e862b777a4fa74e # v1
        with:
          redis-version: "6.x"
          auto-start: true
      - run: redis-cli ping

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "^1.26"

      # gofmt only the files THIS PR/commit actually touches, not the whole
      # tree — an unscoped check (confirmed live, this workflow's first PR
      # run) immediately fails on 4 pre-existing upstream files
      # (magefile.go, pkg/agent/client.go, pkg/service/basic_auth.go,
      # pkg/sfu/packettrailer/packet_trailer_test.go) that are deliberately
      # left unformatted — gating the whole tree would force reformatting
      # unrelated upstream files on every future PR, working against this
      # fork's own low-diff-vs-upstream sync strategy (ARDIUSTECH_FORK.md;
      # same reasoning already settled on the retired Buildkite CI step,
      # reused verbatim here).
      - name: gofmt
        run: |
          set -o pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base" >/dev/null; then
            diff_range="$base...HEAD"
          elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
            diff_range="HEAD^..HEAD"
          else
            diff_range=""
          fi
          if [ -n "$diff_range" ]; then
            changed_go_files="$(git diff --name-only --diff-filter=ACM "$diff_range" -- '*.go')"
          else
            changed_go_files=""
          fi
          if [ -n "$changed_go_files" ]; then
            fmt_out="$(echo "$changed_go_files" | xargs gofmt -l)"
            if [ -n "$fmt_out" ]; then
              echo "gofmt would reformat:" >&2
              echo "$fmt_out" >&2
              exit 1
            fi
          fi

      - name: Build
        run: go build ./...

      # Excludes ./test/... and ./pkg/service/... — same scoping already
      # proven correct on the (now-retired) Buildkite CI step:
      # - ./test/...: real end-to-end WebRTC UDP ICE/STUN/TURN tests that a
      #   sandboxed container's networking can't always reliably support
      #   regardless of whether the code is correct (same category as the
      #   pre-existing flaky ICE tests documented in ARDIUSTECH_FORK.md).
      # - ./pkg/service/...: docker_test.go's TestMain needs a real Docker
      #   daemon via dockertest — ubuntu-latest runners DO have Docker
      #   available, so this exclusion may be unnecessary here (untested);
      #   kept for now to avoid re-litigating a battle already fought on
      #   Buildkite, not because GH Actions is known to lack Docker.
      # None of the fork's own changes live in either package — they're
      # entirely under ./pkg/rtc/. Revisit both exclusions once this
      # workflow has a few green runs under its belt.
      - name: Vet + test
        run: |
          pkgs=$(go list ./... | grep -vE '^github.com/livekit/livekit-server/(test|pkg/service)$')
          # Fails fast if `go list` itself errors (build-cache/disk hiccup)
          # rather than silently falling back to a bare `go vet`/`go test`
          # that would cover only the cwd package and still exit 0 — the
          # exact "silently passes" gap the gofmt check above is also
          # hardened against.
          [ -n "$pkgs" ]
          go vet $pkgs
          go test -race $pkgs

  # Builds + pushes the image AND runs the on-box SSM deploy directly — no
  # Buildkite involved (2026-08-03, see the top-of-file comment for why).
  build-and-deploy:
    name: Build, push, and deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Serialize deploys (review finding, 2026-08-03) — NOT cancel-in-progress
    # like the test job's group above: two out-of-order deploys completing
    # out of order could otherwise let an older commit silently redeploy
    # over a newer one, with everything reporting green. Queuing (not
    # canceling) means they still run in submission order. This is now the
    # ONLY ordering guard (the in-flight SSM check below is a second,
    # independent layer against a manual re-run racing a still-draining box).
    concurrency:
      group: livekit-server-deploy
      cancel-in-progress: false
    # Bounded so a hung run (stalled ECR login/push/SSM poll) drops out of
    # the queue instead of blocking every subsequent deploy behind it
    # (review finding, 2026-08-03). 35, not 25: the SSM poll step alone
    # budgets a full 25 min (300 * 5s — real margin over the on-box
    # DRAIN_TIMEOUT of up to 900s/15min), and that budget shares this SAME
    # job-level timeout with checkout/buildx/ECR-login/build/push ahead of
    # it (observed ~1.5min on a cold run, but unmeasured worst case with no
    # docker layer cache configured). A bare 25 here would let GitHub kill
    # the job mid-poll on any build that runs long, producing a hard
    # timeout instead of the poll step's own graceful "still draining,
    # don't retry blindly" message.
    timeout-minutes: 35
    permissions:
      # contents: read is required for the actions/checkout step below to
      # authenticate its git fetch. No `deployments: write` needed anymore —
      # this job no longer creates a GitHub Deployment at all.
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.LK_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.LK_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      ECR_REGISTRY: "396735084811.dkr.ecr.us-west-2.amazonaws.com"
      ECR_REPO: livekit-server
      DEPLOY_DOCUMENT: watercooler-livekit-deploy-prod
      INSTANCE_TAG: watercooler-livekit-prod
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Soft-skip if CD isn't activated
        id: check-secrets
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "CD not activated: LK_AWS_ACCESS_KEY_ID / LK_AWS_SECRET_ACCESS_KEY repo secrets not set."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.skip == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to ECR
        if: steps.check-secrets.outputs.skip == 'false'
        run: |
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # amd64 only — the LiveKit box is a c6i (Intel) instance, not arm64
      # like the watercooler app's t4g box (see ardiustech/watercooler's
      # infrastructure/livekit/README.md "Notes / decisions"). This is the
      # EXACT `go build`/`go mod download` step blamed for 18/18 CI failures
      # on Buildkite's network — running it here instead is the whole point
      # of this job existing.
      - name: Build + push image
        if: steps.check-secrets.outputs.skip == 'false'
        run: |
          docker buildx build --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPO:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_REPO:latest" \
            --push .

      # Refuse to send a second deploy while one is already in flight against
      # this instance (ported verbatim from the retired Buildkite deploy.sh,
      # review finding 2026-08-02 there). Still needed even with this job's
      # own concurrency group above: that group only serializes GitHub
      # Actions RUNS, not a manual "Re-run jobs" click racing a box that's
      # still mid-graceful-drain from a run GitHub already considers
      # finished. SSM's own command history is the source of truth, not any
      # state this job keeps.
      #
      # Also checks for a prior SUCCESS against this exact commit (review
      # finding, 2026-08-03): the retired create-deployment step's
      # listDeployments-by-sha check doubled as this same dedup — dropping
      # it silently lost the guard against a "Re-run all jobs" click on an
      # already-succeeded run sending a second live graceful-drain restart
      # to production for zero code change. This is the re-added version:
      # since a deploy's SSM comment always embeds the commit SHA (see the
      # trigger step below), a completed Success command whose comment
      # contains this run's SHA means it's already deployed.
      - name: Check for an in-flight or already-completed deploy
        if: steps.check-secrets.outputs.skip == 'false'
        id: dedup-check
        run: |
          set -euo pipefail
          TAG="${{ github.sha }}"

          in_flight="$(aws ssm list-commands \
            --filters "key=DocumentName,value=$DEPLOY_DOCUMENT" \
            --query "Commands[?Status=='InProgress' || Status=='Pending'].CommandId" \
            --output text 2>/dev/null || echo "")"
          if [ -n "$in_flight" ]; then
            echo "::error::a livekit-server deploy is already in flight (CommandId: $in_flight) — refusing to send a second one"
            echo "wait for it to finish, or inspect: aws ssm list-command-invocations --command-id $in_flight"
            exit 1
          fi

          already_deployed="$(aws ssm list-commands \
            --filters "key=DocumentName,value=$DEPLOY_DOCUMENT" "key=Status,value=Success" \
            --query "Commands[?contains(Comment, '$TAG')].CommandId" \
            --output text 2>/dev/null || echo "")"
          if [ -n "$already_deployed" ]; then
            echo "commit $TAG was already successfully deployed (CommandId: $already_deployed) — skipping to avoid an unnecessary graceful-drain restart"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trigger the on-box graceful-drain deploy via SSM and wait for it —
      # ported from the retired Buildkite deploy.sh (see .buildkite/README.md
      # for the full history of why this moved here). Uses the CUSTOM SSM
      # document (ardiustech/watercooler's infrastructure/livekit/
      # ssm_document.tf), not the AWS-managed AWS-RunShellScript — that
      # document can only ever run deploy.sh with a validated Tag, closing
      # off the arbitrary-shell-command surface the generic document would
      # otherwise grant this CI credential.
      #
      # No separate merge-base/ancestor authorization check here (unlike the
      # retired Buildkite step) — that check existed because the OLD trigger
      # (a GitHub Deployment's environment label) was forgeable by anyone
      # with `deployments: write` on the repo, for an arbitrary ref. This job
      # instead runs directly off a real `push` event to `master`, gated by
      # this repo's branch protection (required `test` check + 1 review) —
      # `github.sha` is guaranteed by GitHub itself to be what actually
      # landed on `master`, not a value this job or an API caller can forge.
      - name: Trigger + poll on-box deploy via SSM
        if: steps.check-secrets.outputs.skip == 'false' && steps.dedup-check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ github.sha }}"
          POLL_ATTEMPTS=300

          echo "--- trigger graceful-drain deploy via SSM"
          CMD_ID="$(aws ssm send-command \
            --document-name "$DEPLOY_DOCUMENT" \
            --targets "Key=tag:Name,Values=$INSTANCE_TAG" \
            --comment "livekit-server CD $TAG" \
            --parameters "Tag=$TAG" \
            --query 'Command.CommandId' --output text)"
          echo "command id: $CMD_ID"

          matched=0
          for _ in 1 2 3; do
            sleep 5
            matched="$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'length(CommandInvocations)' --output text 2>/dev/null || echo 0)"
            [ "$matched" != "0" ] && break
          done
          if [ "$matched" = "0" ]; then
            echo "::error::SSM command matched zero instances for tag:Name=$INSTANCE_TAG"
            exit 1
          fi

          for _ in $(seq 1 "$POLL_ATTEMPTS"); do
            sleep 5
            status="$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text 2>/dev/null || echo Pending)"
            echo "deploy status: $status"
            case "$status" in
              Success) echo "deploy succeeded"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "::error::deploy $status — on-box output:"
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text || true
                exit 1
                ;;
            esac
          done
          echo "::error::timed out waiting for the on-box deploy (it may still complete — check: aws ssm list-command-invocations --command-id $CMD_ID)"
          exit 1
